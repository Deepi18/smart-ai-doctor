{% extends "base.html" %}

{% block title %}Patient Login — SMART AI DOCTOR{% endblock %}

{% block content %}
<div class="container-fluid max-w-700 px-0" style="max-width: 440px;">
  <div class="card p-4 shadow-sm my-4">
    <div class="text-center mb-4">
      <h2 class="fw-bold mb-1"><i class="fa-solid fa-right-to-bracket text-primary me-2"></i> Patient Login</h2>
      <p class="text-muted small">Sign in to access your saved health assessments and history log</p>
    </div>

    {% if error %}
      <div class="alert alert-danger border-0 small py-2 mb-3 rounded-3">
        <i class="fa-solid fa-circle-xmark me-1"></i> {{ error }}
      </div>
    {% endif %}

    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="mb-3">
        <label class="form-label text-muted small fw-semibold">Username or Email</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
          <input type="text" name="username_or_email" class="form-control" placeholder="Enter username or email" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label text-muted small fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
          <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-rounded py-2.5 fw-semibold mt-3 shadow-sm">
        <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In to Account
      </button>
    </form>

    <div class="text-center mt-4 pt-3 border-top small text-muted">
      Don't have an account? <a href="/register" class="text-primary fw-semibold text-decoration-none ms-1">Register Patient Account</a>
    </div>
  </div>
</div>
{% endblock %}
